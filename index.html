<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>அனுஷ்டானம்</title>
  <style>
    :root { --ink:#2c3e50; --accent:#b33939; --page:#f5f6fa; --card:#fff; --line:#dcdde1; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:#333; background:var(--page); font-family:'Segoe UI',Tahoma,sans-serif; line-height:1.7; }
    main { width:min(760px, 100%); }
    h1 { margin:0 0 8px; color:var(--ink); font-size:2.3rem; text-align:center; }
    .subtitle { margin:0 0 30px; color:#666; text-align:center; }
    .links { display:grid; gap:16px; }
    .card { display:block; padding:22px 24px; border:1px solid var(--line); border-radius:12px; color:inherit; background:var(--card); box-shadow:0 4px 6px rgba(0,0,0,.05); text-decoration:none; transition:transform .15s, box-shadow .15s; }
    .card:hover, .card:focus-visible { transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.11); outline:3px solid #b9c9d8; outline-offset:2px; }
    h2 { margin:0 0 4px; color:var(--ink); font-size:1.35rem; }
    p { margin:0; color:#666; }
    .arrow { float:right; color:var(--accent); font-size:1.35rem; font-weight:700; }
    @media (max-width:600px) { h1{font-size:1.8rem}.card{padding:18px} }
  </style>
</head>
<body>
  <main>
    <h1>அனுஷ்டானம்</h1>
    <p class="subtitle">தினசரி அனுஷ்டான வழிமுறைகள்</p>
    <nav class="links" aria-label="அனுஷ்டான வழிமுறைகள்">
      <a class="card" href="Madhyanikam/index.html">
        <span class="arrow" aria-hidden="true">→</span>
        <h2>மாத்யாஹ்நிகம்</h2>
        <p>ரிக் வேத மாத்யாஹ்நிக ஸந்த்யாவந்தனம்</p>
      </a>
      <a class="card" href="brahma-yagnam.html">
        <span class="arrow" aria-hidden="true">→</span>
        <h2>ப்ரஹ்மயஜ்ஞம்</h2>
        <p>ரிக்வேதி ஸ்மார்த்த ப்ரஹ்மயஜ்ஞம் வழிமுறை</p>
      </a>
      <a class="card" href="gayathri-japam.html">
        <span class="arrow" aria-hidden="true">→</span>
        <h2>காயத்ரீ ஜபம்</h2>
        <p>1008 காயத்ரீ மந்திர ஜபம் வழிமுறை</p>
      </a>
    </nav>
  </main>
</body>
</html>
